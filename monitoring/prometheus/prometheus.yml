global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "minecraft-alertmanager:9093"

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "minecraft"
    static_configs:
      - targets:
          - "minecraft-metrics-exporter:9100"
        labels:
          instance: "minecraft-server"
